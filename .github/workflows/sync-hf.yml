name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://huggingface.co/spaces/fchavelli/tsseg || true
          git remote set-url hf https://huggingface.co/spaces/fchavelli/tsseg
          git push hf main --force
