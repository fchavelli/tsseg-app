name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Set repository secret HF_TOKEN with write access to the Space."
            exit 1
          fi
          git remote add hf https://fchavelli:${HF_TOKEN}@huggingface.co/spaces/fchavelli/tsseg || true
          git remote set-url hf https://fchavelli:${HF_TOKEN}@huggingface.co/spaces/fchavelli/tsseg
          git push hf main --force
